---
logs:
  level: DEBUG
  token: ~
dicom_reader:
  appId: dicom_reader
  appVersion: 3.0.5
  name: dicom
  archive: true
  archiveSystemId: secure.frontera
  execSystemId: secure.frontera
  archiveSystemDir: /corral-secure/projects/A2CPS/system/jobs/dicom_reader_v3
  maxMinutes: 140
  parameterSet:
    appArgs: 
      - name: FILENAME
        arg: /corral-secure/projects/A2CPS/submissions/UC_uchicago/UC0001V1_A2CPS.zip
  subscriptions:
    - description: Message on Failure
      enabled: true
      eventCategoryFilter: JOB_ERROR_MESSAGE
      deliveryTargets: 
        - deliveryMethod: WEBHOOK
          deliveryAddress: ~
pipelines:
  fmriprep_alias: fmriprep.prod
  mriqc_alias: mriqc.prod
  bids_validator_alias: bids-validator.prod
  vbr_actor_alias: vbr-actor.prod
  heudiconv_alias: heudiconv_router.prod
